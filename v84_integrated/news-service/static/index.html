<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI 지역 뉴스</title><style>body{font-family:system-ui;background:#edf2ff;color:#17233f;margin:0}main{max-width:960px;margin:32px auto}section{background:white;border-radius:18px;padding:20px;margin:12px 0}input,select,button{padding:11px;border:1px solid #cbd5e1;border-radius:9px;margin:5px}button{background:#4338ca;color:white;cursor:pointer}pre{white-space:pre-wrap;background:#eef2ff;padding:14px}</style><main><h1>📰 V8.5.1 AI 지역 뉴스</h1><p>종로구 지역 축제·관광 | Fact Sheet 검증 → gpt-4.1-mini 기사 초안 → 검토대기</p><section><h2>1. 뉴스 주제</h2><input id="district" type="number" placeholder="종로구 district ID"><input id="topic" value="종로구 지역 축제·관광"><button onclick="createTopic()">주제 저장</button><input id="tid" type="number" placeholder="주제 ID"></section><section><h2>2. 원본 자료</h2><input id="org" placeholder="기관"><input id="srcTitle" placeholder="기사/자료 제목"><input id="url" placeholder="https://..."><input id="pub" type="datetime-local"><button onclick="source()">출처 저장</button><input id="sid" type="number" placeholder="출처 ID"></section><section><h2>3. Fact Sheet</h2><input id="key" placeholder="사실 키"><select id="type"><option>text</option><option>number</option><option>date</option><option>place</option></select><input id="value" placeholder="확인한 사실"><button onclick="fact()">사실 저장</button><button onclick="load()">목록 조회</button><div id="facts"></div></section><section><h2>4. AI 기사 생성</h2><button onclick="generate()">검증된 Fact로 초안 생성</button><div id="drafts"></div></section><section><h2>5. 사람 검수</h2><input id="did" type="number" placeholder="초안 ID"><label><input id="n" type="checkbox">수치 정확</label><label><input id="r" type="checkbox">지역·날짜 정확</label><label><input id="c" type="checkbox">인과 단정 없음</label><label><input id="s" type="checkbox">출처 정확</label><input id="comment" placeholder="검수 의견"><button onclick="review()">검수 결과 저장</button><p>최종 승인/공개는 V8.5.2에서 구현됩니다.</p></section><section><h2>결과 / 오류</h2><pre id="out"></pre></section></main><script>
let E=id=>document.getElementById(id),V=id=>E(id).value,T=()=>Number(V('tid'));
function escapeHtml(s){return String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;')}
async function api(url,method='GET',body=null){try{let r=await fetch(url,{method,headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});let j=await r.json();if(!r.ok)throw Error(JSON.stringify(j));E('out').textContent=JSON.stringify(j,null,2);return j}catch(e){E('out').textContent=e.message;return null}}
async function createTopic(){let r=await api('/topics','POST',{district_id:+V('district'),title:V('topic'),category:'festival'});if(r)E('tid').value=r.id}
async function source(){let r=await api('/sources','POST',{topic_id:T(),organization:V('org'),source_title:V('srcTitle'),source_url:V('url'),published_at:new Date(V('pub')).toISOString()});if(r)E('sid').value=r.id}
async function fact(){await api('/facts','POST',{topic_id:T(),fact_key:V('key'),fact_type:V('type'),value_text:V('value'),source_id:+V('sid'),value_number:V('type')==='number'?Number(V('value')):null});await load()}
async function load(){let f=await api('/facts/'+T());if(f)E('facts').innerHTML=f.map(x=>'<p>Fact '+x.id+': '+escapeHtml(x.value_text)+' ['+x.status+'] <button onclick="verify('+x.id+')">출처 확인 및 검증</button></p>').join('');let d=await api('/drafts/'+T());if(d)E('drafts').innerHTML=d.map(x=>'<section><b>'+escapeHtml(x.title)+' (#'+x.id+')</b><pre>'+escapeHtml(x.body_text)+'</pre></section>').join('')}
async function verify(id){await api('/facts/'+id+'/verify','POST');await load()}
async function generate(){let r=await api('/drafts/'+T()+'/generate','POST');if(r)E('did').value=r.draft_id;await load()}
async function review(){await api('/drafts/'+Number(V('did'))+'/review','POST',{numbers:E('n').checked,time_and_region:E('r').checked,no_unfounded_causes:E('c').checked,source_and_observed_at:E('s').checked,comment:V('comment')})}
</script></html>
